<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo kantoru</title>
</head>
<body>
  <script>
    const repoPath = '/Kantor-Uniwersalny/';
    const match = window.location.pathname.match(/\/demo-([a-z0-9-]+)\/?$/i);
    const hash = match ? `#demo-${match[1].toLowerCase()}` : '';
    window.location.replace(`${window.location.origin}${repoPath}${hash}`);
  </script>
  <p>Przekierowuję do wersji demo...</p>
</body>
</html>
